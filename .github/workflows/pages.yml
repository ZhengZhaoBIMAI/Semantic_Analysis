name: Deploy semantic reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/component_attribute_analysis/dataset_results/dataset_semantic_report.html'
      - 'experiments/component_attribute_analysis/single_model_results/model_0/semantic_audit.html'
      - 'experiments/component_attribute_analysis/focus_results/**'
      - 'experiments/component_attribute_analysis/tabular_results/**'
      - '.github/scripts/build_pages.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare HTML reports
        run: python3 .github/scripts/build_pages.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
